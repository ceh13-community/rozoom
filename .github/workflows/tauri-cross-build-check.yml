# Temporary: compiles this branch's Tauri update on macOS and Windows, where the release
# workflow builds only from main. No bundles, no signing, nothing published. Removed again
# before the branch is merged.
name: Tauri cross-build check

on:
  push:
    branches: [chore/tauri-2.11-security]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-cross-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Release build without bundles (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      VITE_ROZOOM_TOOLS: "kubectl,helm"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup rust
        uses: ./.github/actions/setup-rust

      - name: Download binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./dashboard-app
        run: pnpm download:binaries

      - name: Build the slim app, release profile, locked dependencies
        shell: bash
        working-directory: ./dashboard-app
        run: pnpm tauri build --config src-tauri/tauri.slim.conf.json --no-bundle -- --locked

name: "Mobile App CI"

on:
  pull_request:
    branches: [main, master]
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/actions/setup-playwright/**"
  push:
    branches: [main, master]
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/actions/setup-playwright/**"

defaults:
  run:
    working-directory: ./mobile-app

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: mobile-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks (format + lint + types)
        run: pnpm run check

      - name: Unit tests
        run: pnpm test:run

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: checks
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: mobile-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: ./mobile-app
          cache-key: playwright-mobile-${{ runner.os }}-${{ hashFiles('mobile-app/pnpm-lock.yaml') }}
          cache-restore-keys: |
            playwright-mobile-${{ runner.os }}-

      # Chromium only in CI. WebKit needs a long apt pass (GStreamer and
      # friends) on every run, and that pass is what hung this job to its
      # timeout. The mobile-safari project stays in the config for local runs.
      - name: Run E2E tests
        run: pnpm test:e2e --project=mobile-chrome

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: mobile-app/playwright-report
          if-no-files-found: ignore

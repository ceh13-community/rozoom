  #       uses: swatinem/rust-cache@v2
  #       with:
  #         workspaces: './dashboard-app/src-tauri -> target'
  #
  #     - name: Setup Java
  #       uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: "17"
  #
  #     - name: Setup Android SDK
  #       uses: android-actions/setup-android@v3
  #
  #     - name: Install Linux build dependencies
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y --no-install-recommends libglib2.0-dev libgtk-3-dev pkg-config
  #
  #     - name: Install Android dependencies
  #       run: |
  #         sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
  #
  #     - name: Download binaries
  #       run: pnpm download:binaries
  #
  #     - name: Init Android project
  #       run: pnpm tauri android init
  #
  #     - name: Build Android APK (debug)
  #       run: pnpm tauri android build --debug

  publish-tauri:
    ### Release only manually and only from master
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM (Apple Silicon M1+)
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            label: "macOS ARM64"
          # # macOS Intel (disabled)
          # - platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin --bundles app,dmg"
          #   label: "macOS x64"
          # Linux x86_64 (DEB + RPM; AppImage built separately below)
          - platform: "ubuntu-22.04"
            args: "--bundles deb,rpm"
            label: "Linux x64"
          # # Linux ARM64 (disabled)
          # - platform: "ubuntu-24.04"
          #   args: "--target aarch64-unknown-linux-gnu --bundles deb"
          #   label: "Linux ARM64"
          # Windows x64 (MSI + NSIS installer)
          - platform: "windows-latest"
            args: "--bundles msi,nsis"
            label: "Windows x64"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve app version
        shell: bash
        working-directory: ./dashboard-app
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version' | tr -d '\r\n')" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup rust
        uses: ./.github/actions/setup-rust

      - name: Install ARM64 cross-compilation toolchain
        if: contains(matrix.args, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Download binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./dashboard-app
        run: pnpm download:binaries

      - name: Sanitize version for MSI compatibility
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ./dashboard-app
        run: |
          RAW="${{ env.APP_VERSION }}"
          # MSI requires numeric-only pre-release identifiers (<= 65535)
          # Convert e.g. 0.21.0-rc.1 -> 0.21.0-1 (valid semver + MSI-compatible)
          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[a-zA-Z]+\.([0-9]+)$ ]]; then
            MSI_VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            echo "Sanitizing version for MSI: $RAW -> $MSI_VERSION"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              c.version = '$MSI_VERSION';
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            "
            sed -i "s/^version = \"$RAW\"/version = \"$MSI_VERSION\"/" src-tauri/Cargo.toml
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Updater artifacts (.sig + latest.json) are signed with the project
          # minisign key. Missing secrets fail the build loudly rather than
          # shipping an unsigned release the updater would reject.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: dashboard-app
          tagName: app-v${{ env.APP_VERSION }}
          releaseName: "App v${{ env.APP_VERSION }}"
          releaseBody: |
            Release `v${{ env.APP_VERSION }}` is available as a draft build.

            ## Artifacts by platform

            | Platform | Architecture | Artifacts |
            |----------|-------------|-----------|
            | **Windows** | x64 | `.msi`, `.exe` (NSIS) |
            | **macOS** | ARM64 (M1+) | `.dmg`, `.app.tar.gz` |
            | **Linux** | x64 | `.deb`, `.rpm`, `.AppImage` |

            Download the package matching your OS and architecture.

            Notes:
            - Linux artifacts use normalized filenames with underscores.
            - macOS: run `xattr -dr com.apple.quarantine /Applications/ROZOOM*.app` if quarantined.
            - This draft release is intended for validation before final publication.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload .deb for render smoke
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-x64
          path: dashboard-app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Build AppImage (best-effort, linuxdeploy plugin can be unstable)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: ./dashboard-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage

      - name: Upload AppImage to draft release
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          draft: true
          files: |
            dashboard-app/src-tauri/target/release/bundle/appimage/*.AppImage
            dashboard-app/src-tauri/target/release/bundle/appimage/*.AppImage.sig

      # AppImage is the only Linux package the Tauri updater can replace, but it
      # is built outside tauri-action, so it never lands in latest.json. Merge
      # the linux-x86_64 entry in by hand. Best-effort like the AppImage build:
      # a failure here leaves Linux without in-app updates, not without a release.
      - name: Register AppImage in latest.json
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        working-directory: ./dashboard-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: app-v${{ env.APP_VERSION }}
        run: bash ./scripts/register-appimage-in-latest-json.sh "$TAG"

      - name: Build RPM fallback artifact
        if: runner.os == 'Linux'
        working-directory: ./dashboard-app
        run: pnpm run build:rpm

      - name: Upload RPM fallback to draft release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          draft: true
          files: dashboard-app/src-tauri/target/release/bundle/rpm/ROZOOM_K8s_Linter_IDE_${{ env.APP_VERSION }}_x86_64.rpm

  # Release gate: install the freshly built .deb in clean end-user distros and
  # verify the window actually renders (not just that the bundle built). Added
  # after 0.22.x shipped a .deb that launched to a blank window on Kali —
  # nothing in build or e2e (web-only) could have caught it.
  deb_render_smoke:
    name: "Deb render smoke (${{ matrix.distro }})"
    needs: publish-tauri
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:12", "kalilinux/kali-rolling"]
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download built .deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb-x64
          path: dashboard-app/deb

      - name: Install and verify window renders
        run: bash ./scripts/deb-render-smoke.sh deb/*.deb


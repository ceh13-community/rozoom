  #       uses: swatinem/rust-cache@v2
  #       with:
  #         workspaces: './dashboard-app/src-tauri -> target'
  #
  #     - name: Setup Java
  #       uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: "17"
  #
  #     - name: Setup Android SDK
  #       uses: android-actions/setup-android@v3
  #
  #     - name: Install Linux build dependencies
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y --no-install-recommends libglib2.0-dev libgtk-3-dev pkg-config
  #
  #     - name: Install Android dependencies
  #       run: |
  #         sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
  #
  #     - name: Download binaries
  #       run: pnpm download:binaries
  #
  #     - name: Init Android project
  #       run: pnpm tauri android init
  #
  #     - name: Build Android APK (debug)
  #       run: pnpm tauri android build --debug

  publish-tauri:
    ### Release only manually and only from master
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM (Apple Silicon M1+)
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            label: "macOS ARM64"
          # # macOS Intel (disabled)
          # - platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin --bundles app,dmg"
          #   label: "macOS x64"
          # Linux x86_64 (DEB + RPM; AppImage dropped: the bundled
          # WebKit/EGL stack aborts on launch, headless and on real GPUs)
          - platform: "ubuntu-22.04"
            args: "--bundles deb,rpm"
            label: "Linux x64"
          # # Linux ARM64 (disabled)
          # - platform: "ubuntu-24.04"
          #   args: "--target aarch64-unknown-linux-gnu --bundles deb"
          #   label: "Linux ARM64"
          # Windows x64 (MSI + NSIS installer)
          - platform: "windows-latest"
            args: "--bundles msi,nsis"
            label: "Windows x64"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve app version
        shell: bash
        working-directory: ./dashboard-app
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version' | tr -d '\r\n')" >> "$GITHUB_ENV"

      # The release body doubles as the updater-dialog notes (tauri-action
      # copies it into latest.json). A missing changelog entry fails the
      # release here, before any build minutes are spent.
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        working-directory: ./dashboard-app
        run: |
          {
            echo "RELEASE_NOTES<<CHANGELOG_NOTES_EOF"
            bash ./scripts/extract-release-notes.sh "${{ env.APP_VERSION }}" ../CHANGELOG.md
            echo "CHANGELOG_NOTES_EOF"
          } >> "$GITHUB_ENV"

      # WAU-C telemetry: an empty PUBLIC_POSTHOG_KEY does not fail the build —
      # the release ships fine and telemetry is just permanently dark, which is
      # only discovered weeks later in PostHog. Fail the release up front
      # instead, same policy as the updater signing secrets above.
      - name: Fail fast on empty PUBLIC_POSTHOG_KEY
        shell: bash
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
        run: |
          if [[ -z "${PUBLIC_POSTHOG_KEY//[[:space:]]/}" ]]; then
            echo "::error::PUBLIC_POSTHOG_KEY secret is unset or blank; the release would ship with telemetry permanently dark. Set the repo secret and re-run."
            exit 1
          fi

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup rust
        uses: ./.github/actions/setup-rust

      - name: Install ARM64 cross-compilation toolchain
        if: contains(matrix.args, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Download binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./dashboard-app
        run: pnpm download:binaries

      - name: Sanitize version for MSI compatibility
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ./dashboard-app
        run: |
          RAW="${{ env.APP_VERSION }}"
          # MSI requires numeric-only pre-release identifiers (<= 65535)
          # Convert e.g. 0.21.0-rc.1 -> 0.21.0-1 (valid semver + MSI-compatible)
          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[a-zA-Z]+\.([0-9]+)$ ]]; then
            MSI_VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            echo "Sanitizing version for MSI: $RAW -> $MSI_VERSION"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              c.version = '$MSI_VERSION';
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            "
            sed -i "s/^version = \"$RAW\"/version = \"$MSI_VERSION\"/" src-tauri/Cargo.toml
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifacts (.sig + latest.json) are signed with the project
          # minisign key. Missing secrets fail the build loudly rather than
          # shipping an unsigned release the updater would reject.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # WAU-C telemetry: $env/dynamic/public is captured into _app/env.js at
          # build time, so the PostHog key must be in the env when
          # beforeBuildCommand (pnpm build) runs. Without it the release ships
          # with telemetry permanently dark even after user consent.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
        with:
          projectPath: dashboard-app
          tagName: app-v${{ env.APP_VERSION }}
          releaseName: "App v${{ env.APP_VERSION }}"
          # The first line below is what a user reads in the updater dialog;
          # the artifact table stays on the release page only — the
          # finalize-release-assets job rewrites latest*.json notes to the
          # changelog text without it.
          releaseBody: |
            ${{ env.RELEASE_NOTES }}

            ## Artifacts by platform

            | Platform | Architecture | Artifacts |
            |----------|-------------|-----------|
            | **Windows** | x64 | `.msi`, `.exe` (NSIS) |
            | **macOS** | ARM64 (M1+) | `.dmg`, `.app.tar.gz` |
            | **Linux** | x64 | `.deb`, `.rpm` |

            Download the package matching your OS and architecture.

            Notes:
            - Linux artifacts use normalized filenames with underscores.
            - macOS: run `xattr -dr com.apple.quarantine /Applications/ROZOOM*.app` if quarantined.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload .deb for render smoke
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-x64
          path: dashboard-app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error


  # Slim tool-pack variant: same release, second set of artifacts. Bundles only
  # kubectl + helm (VITE_ROZOOM_TOOLS filters both download-binaries.js and the
  # frontend tool registry); tauri.slim.conf.json swaps the updater endpoint to
  # latest-slim.json so slim installs only ever see slim updates, while the
  # legacy endpoint (latest.json) keeps serving full artifacts to existing
  # installs untouched. Built outside tauri-action: artifacts are renamed to
  # `_slim` names and the slim updater manifest is assembled by scripts, none
  # of which tauri-action supports. Runs after publish-tauri so the draft
  # release already exists (avoids two racing draft releases for one tag).
  publish-tauri-slim:
    needs: publish-tauri
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            label: "macOS ARM64 slim"
            updater-platform: "darwin-aarch64"
          - platform: "ubuntu-22.04"
            args: "--bundles deb,rpm"
            label: "Linux x64 slim"
            updater-platform: "linux-x86_64"
          - platform: "windows-latest"
            args: "--bundles msi,nsis"
            label: "Windows x64 slim"
            updater-platform: "windows-x86_64"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      # Build-time tool filter: download-binaries.js only provisions these
      # sidecars and the frontend registry hides everything else.
      VITE_ROZOOM_TOOLS: "kubectl,helm"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve app version
        shell: bash
        working-directory: ./dashboard-app
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version' | tr -d '\r\n')" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup rust
        uses: ./.github/actions/setup-rust

      - name: Download binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./dashboard-app
        run: pnpm download:binaries

      - name: Sanitize version for MSI compatibility
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ./dashboard-app
        run: |
          RAW="${{ env.APP_VERSION }}"
          # MSI requires numeric-only pre-release identifiers (<= 65535)
          # Convert e.g. 0.21.0-rc.1 -> 0.21.0-1 (valid semver + MSI-compatible)
          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[a-zA-Z]+\.([0-9]+)$ ]]; then
            MSI_VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            echo "Sanitizing version for MSI: $RAW -> $MSI_VERSION"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              c.version = '$MSI_VERSION';
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            "
            sed -i "s/^version = \"$RAW\"/version = \"$MSI_VERSION\"/" src-tauri/Cargo.toml
          fi

      - name: Build slim bundles
        shell: bash
        working-directory: ./dashboard-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Same constraint as the full build: the PostHog key must be in the
          # env when beforeBuildCommand (pnpm build) runs.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
        run: pnpm tauri build --config src-tauri/tauri.slim.conf.json ${{ matrix.args }}

      - name: Rename artifacts to slim names
        shell: bash
        working-directory: ./dashboard-app
        run: bash ./scripts/rename-slim-artifacts.sh

      # Release gate (accepted risk closure): assert on the built artifact that
      # the slim binary points at latest-slim.json and NOT at the inherited
      # full endpoint. Without this a config regression would silently update
      # every slim install to the full bundle.
      - name: Assert slim updater endpoint in built artifact
        if: runner.os == 'Linux'
        working-directory: ./dashboard-app
        run: bash ./scripts/assert-slim-updater-endpoint.sh src-tauri/target/release/bundle/deb/*_slim.deb

      - name: Report slim artifact sizes
        shell: bash
        working-directory: ./dashboard-app
        run: find src-tauri/target -path '*/bundle/*' -name '*_slim*' -type f -exec du -h {} \;

      - name: Upload slim artifacts to draft release
        shell: bash
        working-directory: ./dashboard-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: app-v${{ env.APP_VERSION }}
        # macOS runners ship bash 3.2, which has no `mapfile`; keep this loop
        # bash-3 compatible or the darwin slim job dies before uploading.
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find src-tauri/target -path '*/bundle/*' -name '*_slim*' -type f)
          [[ ${#files[@]} -gt 0 ]] || { echo "no slim artifacts found to upload" >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

      # No Linux entry: the AppImage was the only updater-replaceable Linux
      # package and it is no longer shipped (WebKit/EGL abort on launch, both
      # headless and on real GPUs), so Linux installs update via deb/rpm.
      - name: Register in latest-slim.json
        if: runner.os != 'Linux'
        shell: bash
        working-directory: ./dashboard-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: app-v${{ env.APP_VERSION }}
        run: |
          case "${{ matrix.updater-platform }}" in
            darwin-aarch64) pattern='*_slim.app.tar.gz' ;;
            windows-x86_64) pattern='*_slim_en-US.msi' ;;
          esac
          artifact="$(find src-tauri/target -path '*/bundle/*' -name "$pattern" -type f | head -n1)"
          [[ -n "$artifact" ]] || { echo "no updater artifact matching $pattern" >&2; exit 1; }
          bash ./scripts/register-in-latest-slim-json.sh "$TAG" "${{ matrix.updater-platform }}" "$artifact"

      - name: Upload slim .deb for render smoke
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-x64-slim
          path: dashboard-app/src-tauri/target/release/bundle/deb/*_slim.deb
          if-no-files-found: error

  # Single-writer finalization: rename full assets to `_full-offline`, patch
  # latest.json URLs accordingly, and cross-verify that each manifest only
  # references its own variant's assets.
  finalize-release-assets:
    needs: [publish-tauri, publish-tauri-slim]
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve app version
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version' | tr -d '\r\n')" >> "$GITHUB_ENV"

      - name: Finalize asset names and verify manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/finalize-release-asset-names.sh "app-v${{ env.APP_VERSION }}"

      # tauri-action copies the whole release body (artifact table included)
      # into latest.json notes, and the slim manifest bootstraps with a
      # placeholder. The in-app notification shows fixed copy (app-updater.ts)
      # and never renders these notes, but latest.json is still the public
      # release-notes feed. Replace both with the changelog section for this
      # version.
      - name: Rewrite updater notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./scripts/extract-release-notes.sh "${{ env.APP_VERSION }}" ../CHANGELOG.md > /tmp/updater-notes.md
          bash ./scripts/set-updater-notes.sh "app-v${{ env.APP_VERSION }}" /tmp/updater-notes.md

  # Release gate: install the freshly built .deb in clean end-user distros and
  # verify the window actually renders (not just that the bundle built). Added
  # after 0.22.x shipped a .deb that launched to a blank window on Kali —
  # nothing in build or e2e (web-only) could have caught it.
  deb_render_smoke:
    name: "Deb render smoke (${{ matrix.artifact }}, ${{ matrix.distro }})"
    needs: [publish-tauri, publish-tauri-slim]
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:12", "kalilinux/kali-rolling"]
        artifact: ["linux-deb-x64", "linux-deb-x64-slim"]
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download built .deb
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dashboard-app/deb

      - name: Install and verify window renders
        run: bash ./scripts/deb-render-smoke.sh deb/*.deb

  # android-build:
  #   name: Build Android (manual)
  #   if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 60
  #   permissions:
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v5
  #       with:
  #         fetch-depth: 1
  #
  #     - name: Setup pnpm
  #       uses: ./.github/actions/setup-pnpm
  #
  #     - name: Setup Rust
  #       uses: dtolnay/rust-toolchain@stable
  #       with:
  #         targets: aarch64-linux-android
  #
  #     - name: Rust cache
  #       uses: swatinem/rust-cache@v2
  #       with:
  #         workspaces: './dashboard-app/src-tauri -> target'
  #
  #     - name: Setup Java
  #       uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: "17"
  #
  #     - name: Setup Android SDK
  #       uses: android-actions/setup-android@v3
  #
  #     - name: Install Android dependencies
  #       run: |
  #         sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
  #
  #     - name: Download binaries
  #       run: pnpm download:binaries
  #
  #     - name: Build Android APK (debug)
  #       run: pnpm tauri android build --debug
  #
  #     - name: Upload APK artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: android-apk
  #         path: dashboard-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  #         if-no-files-found: error

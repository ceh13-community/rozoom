  #       run: pnpm tauri android build --debug

  publish-tauri:
    ### Release only manually and only from master
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM (Apple Silicon M1+)
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            label: "macOS ARM64"
          # # macOS Intel (disabled)
          # - platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin --bundles app,dmg"
          #   label: "macOS x64"
          # Linux x86_64 (DEB + RPM; AppImage built separately below)
          - platform: "ubuntu-22.04"
            args: "--bundles deb,rpm"
            label: "Linux x64"
          # # Linux ARM64 (disabled)
          # - platform: "ubuntu-24.04"
          #   args: "--target aarch64-unknown-linux-gnu --bundles deb"
          #   label: "Linux ARM64"
          # Windows x64 (MSI + NSIS installer)
          - platform: "windows-latest"
            args: "--bundles msi,nsis"
            label: "Windows x64"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve app version
        shell: bash
        working-directory: ./dashboard-app
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version' | tr -d '\r\n')" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup rust
        uses: ./.github/actions/setup-rust

      - name: Install ARM64 cross-compilation toolchain
        if: contains(matrix.args, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Download binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./dashboard-app
        run: pnpm download:binaries

      - name: Sanitize version for MSI compatibility
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ./dashboard-app
        run: |
          RAW="${{ env.APP_VERSION }}"
          # MSI requires numeric-only pre-release identifiers (<= 65535)
          # Convert e.g. 0.21.0-rc.1 -> 0.21.0-1 (valid semver + MSI-compatible)
          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[a-zA-Z]+\.([0-9]+)$ ]]; then
            MSI_VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            echo "Sanitizing version for MSI: $RAW -> $MSI_VERSION"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              c.version = '$MSI_VERSION';
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            "
            sed -i "s/^version = \"$RAW\"/version = \"$MSI_VERSION\"/" src-tauri/Cargo.toml
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          projectPath: dashboard-app
          tagName: app-v${{ env.APP_VERSION }}
          releaseName: "App v${{ env.APP_VERSION }}"
          releaseBody: |
            Release `v${{ env.APP_VERSION }}` is available as a draft build.

            ## Artifacts by platform

            | Platform | Architecture | Artifacts |
            |----------|-------------|-----------|
            | **Windows** | x64 | `.msi`, `.exe` (NSIS) |
            | **macOS** | ARM64 (M1+) | `.dmg`, `.app.tar.gz` |
            | **macOS** | x64 (Intel) | `.dmg`, `.app.tar.gz` |
            | **Linux** | x64 | `.deb`, `.rpm`, `.AppImage` |
            | **Linux** | ARM64 | `.deb` |

            Download the package matching your OS and architecture.

            Notes:
            - Linux artifacts use normalized filenames with underscores.
            - macOS: run `xattr -dr com.apple.quarantine /Applications/ROZOOM*.app` if quarantined.
            - This draft release is intended for validation before final publication.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build AppImage (best-effort, linuxdeploy plugin can be unstable)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: ./dashboard-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: pnpm tauri build --bundles appimage

      - name: Upload AppImage to draft release
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          draft: true
          files: dashboard-app/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Build RPM fallback artifact
        if: runner.os == 'Linux'
        working-directory: ./dashboard-app
        run: pnpm run build:rpm

      - name: Upload RPM fallback to draft release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          draft: true
          files: dashboard-app/src-tauri/target/release/bundle/rpm/ROZOOM_K8s_Linter_IDE_${{ env.APP_VERSION }}_x86_64.rpm


name: "CI/CD for Tauri App"

on:
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - master
  workflow_dispatch: {} # Manual run button

defaults:
  run:
    working-directory: ./dashboard-app

concurrency:
  # Scope the group by event so a push to main can't cancel a manual
  # release build (workflow_dispatch) running on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Never auto-cancel manual release runs; only supersede push/PR runs.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRIVY_VERSION: "0.70.0"
  # Pin doggo: v1.2.0 changed release asset naming from
  # doggo_<ver>_<Os>_<arch> to doggo-<os>-<arch>, which breaks the sidecar
  # downloader's checksum lookup. Hold at the last compatible release until
  # the downloader is taught the new naming scheme.
  DOGGO_VERSION: "1.1.7"

jobs:
  pr_checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Static checks (format + lint + types)
        run: pnpm run check

      - name: Run tests
        run: pnpm vitest run

      - name: Build web app
        run: pnpm run build

  e2e_smoke:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build web app
        run: pnpm run build

      # Restore-only: we never trust the cache blindly. A previous CDN-stalled
      # run could have *saved* an empty/partial ms-playwright dir (the install
      # step exits 0 on the graceful-skip path), which then gets restored on
      # every subsequent run, install gets skipped, and the browser binary is
      # silently missing -> all e2e fail at launch. So restore here, but verify
      # + (re)install below, and only save back a cache that actually works.
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard-app/pnpm-lock.yaml') }}

      - name: Install Playwright system deps
        timeout-minutes: 6
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright browser (Chromium)
        id: chromium_install
        timeout-minutes: 12
        # Always run (no cache-hit guard): `playwright install chromium` is
        # idempotent — a near-instant no-op when the binary is already present
        # and valid, a download when it is missing or the cache was poisoned.
        # cdn.playwright.dev download can stall mid-transfer; a hung connection
        # never errors on its own, so bound each attempt with `timeout` and
        # retry on a fresh connection. The download failing is an infra/CDN
        # problem, not a code regression — after 3 attempts emit a warning and
        # skip the smoke (this job is already non-blocking) instead of a red ❌
        # that reads like a test failure.
        run: |
          for attempt in 1 2 3; do
            echo "Chromium install/verify attempt $attempt/3"
            timeout 180 pnpm exec playwright install chromium && {
              echo "available=true" >> "$GITHUB_OUTPUT"; exit 0;
            }
            echo "attempt $attempt stalled or failed; retrying"
            sleep 5
          done
          echo "::warning::Playwright chromium download failed after 3 attempts (CDN/infra); skipping e2e smoke — non-blocking."
          echo "available=false" >> "$GITHUB_OUTPUT"
          exit 0

      # Save only a working browser. Never persist the cache from a CDN-stalled
      # run — that is exactly what poisons it for every later run until the
      # lockfile hash changes. Skip the save on a cache-hit (nothing changed).
      - name: Save Playwright browser cache
        if: steps.chromium_install.outputs.available == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run e2e smoke
        if: steps.chromium_install.outputs.available != 'false'
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard-app/playwright-report
          if-no-files-found: ignore

  # mobile-app CI is handled separately in .github/workflows/mobile-ci.yml
  # (path-triggered on mobile-app/** changes). Android Tauri build is excluded
  # from this workflow — build time is 60+ min and requires Android SDK setup
  # which is not worth running on every dashboard-app PR.
  # TODO(#57): revisit if mobile-app and dashboard-app PRs need joint validation.

  # android_checks:
  #   name: Android validation (PR)
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 60
  #   permissions:
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v5
  #       with:
  #         fetch-depth: 1
  #
  #     - name: Setup pnpm
  #       uses: ./.github/actions/setup-pnpm
  #
